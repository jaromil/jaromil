    <text x="80" y="450">* # @ # * + : .           . : + * # @ # * +</text>
    <text x="80" y="530"># @ # * + : .               . : + * # @ # *</text>
    <text x="80" y="610">* # @ # * + : .           . : + * # @ # * +</text>
