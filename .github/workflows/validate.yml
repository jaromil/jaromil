name: Validate site

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@10.13.1 --rule void-style:off --rule doctype-style:off index.html

      - name: Check formatting
        run: npx --yes prettier@3.8.3 --check index.html style.css .github/workflows/validate.yml
